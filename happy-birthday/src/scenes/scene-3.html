<!-- SCENE 3: LỜI ANH MUỐN NÓI -->

            <p data-main='"Anh cũng không biết từ khi nào..."'

            <p data-main='"Đôi khi chỉ là một tin nhắn thui..."'

               data-emo-sub-l="💞" data-emo-sub-r="✨"></p>

            <p data-main='"Bé Bơ có đồng ý hummm?"'
               data-sub='Đồng ý để anh được thương em, quan tâm em và cùng em đi qua thật nhiều mùa sinh nhật nữa nhé?'
